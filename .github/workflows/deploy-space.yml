# En cada push a main que toque la app, sube el código al Space de Hugging Face.
# Requiere en GitHub (Settings > Secrets and variables > Actions):
#   secret   HF_TOKEN        token de Hugging Face con permiso de escritura
#   secret   HF_READ_TOKEN   token de solo lectura para el Space (opcional)
#   variable HF_SPACE        p. ej. PabloDMC/acb-statistics
#   variable ACB_DB_DATASET  p. ej. PabloDMC/acb-statistics-db
name: Deploy Space
on:
  push:
    branches: [main]
    paths: ["src/api/**", "src/app/**", ".streamlit/**", "deploy/**", "requirements-serve.txt", "scripts/deploy_space.py"]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub python-dotenv
      - run: python scripts/deploy_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_READ_TOKEN: ${{ secrets.HF_READ_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          ACB_DB_DATASET: ${{ vars.ACB_DB_DATASET }}
