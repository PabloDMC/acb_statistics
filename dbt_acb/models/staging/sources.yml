version: 2

sources:
  - name: acb_landing
    description: "Raw JSON payloads extracted directly from the official ACB Basketball API endpoints."
    loader: python_scripts
    
    tables:
      - name: competitions
        description: >
          Global parameters of the running competition.
        meta:
          external_location: "{{ var('landing_data_dir') }}/apiacb_competition/*.json"

      - name: matchlists
        description: >
          Schedules and fixture definitions grouped by rounds or phases.
        meta:
          # Se lee cada fichero como JSON crudo (sin inferir esquema) y el modelo extrae los campos.
          # Inferir el esquema fallaba: los calendarios de jornadas sin jugar traen los equipos con
          # menos campos, y leer el esquema de los ~2.000 ficheros a la vez agotaba la memoria.
          external_location: "read_json_objects('{{ var('landing_data_dir') }}/apiacb_matchlist/*.json', format='auto')"

      - name: match_headers
        description: >
          General match overview and status.
        meta:
          external_location: "{{ var('landing_data_dir') }}/apiacb_match_header/*.json"

      - name: boxscores
        description: >
          Deeply nested traditional boxscores.
        meta:
          external_location: "{{ var('landing_data_dir') }}/apiacb_boxscore/*.json"

      - name: match_shots
        description: >
          Advanced spatial shot charts.
        meta:
          external_location: "{{ var('landing_data_dir') }}/apiacb_match_shots/*.json"

      - name: play_by_play
        description: >
          Chronological live commentary log.
        meta:
          external_location: "{{ var('landing_data_dir') }}/apiacb_play_by_play/*.json"

      - name: player_bios
        description: >
          Fichas biográficas de jugador sacadas de la web de la ACB (src/ingestion/player_bio.py).
        meta:
          # DuckDB adivina la fecha "dd-mm-aaaa" como DATE: se le fija el formato para que no la
          # confunda con mes-día. Sin union_by_name: con ~1.500 ficheros abre todos a la vez para
          # leer su esquema y agota la memoria (todas las fichas tienen los mismos campos).
          external_location: "read_json('{{ var('landing_data_dir') }}/acbweb_player_bio/*.json', format='newline_delimited', dateformat='%d-%m-%Y')"
